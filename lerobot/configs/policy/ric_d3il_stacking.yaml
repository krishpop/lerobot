# @package _global_

defaults:
  - _self_
  - policy/vqbet_d3il_stacking@vqbet_config
  - policy/diffusion_d3il_stacking@diffusion_config
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

seed: 100000
dataset_repo_id: krishpop/d3il_stacking

override_dataset_stats:
  observation.images.bp_cam:
    # stats from imagenet, since we use a pretrained vision model
    mean: [[[0.485]], [[0.456]], [[0.406]]]  # (c,1,1)
    std: [[[0.229]], [[0.224]], [[0.225]]]  # (c,1,1)
  observation.images.inhand_cam:
    # stats from imagenet, since we use a pretrained vision model
    mean: [[[0.485]], [[0.456]], [[0.406]]]  # (c,1,1)
    std: [[[0.229]], [[0.224]], [[0.225]]]  # (c,1,1)

training:
  offline_steps: 2000000
  online_steps: 0
  eval_freq: 25000
  save_freq: 25000
  save_checkpoint: true

  batch_size: 64
  grad_clip_norm: 10
  lr: 1.0e-4
  lr_scheduler: cosine
  lr_warmup_steps: 500
  adam_betas: [0.95, 0.999]
  adam_eps: 1.0e-8
  adam_weight_decay: 1.0e-6
  online_steps_between_rollouts: 1

policy:
  name: ric
  multitask: false
  num_tasks: 1
  task_dim: 32
  mlp_dim: 256
  latent_dim: 256
  image_encoder_hidden_dim: 256
  state_encoder_hidden_dim: 256
  num_bins: 100
  dropout: 0.1

  # Inference parameters
  use_mpc: true
  cem_iterations: 6
  max_std: 2.0
  min_std: 0.05
  n_gaussian_samples: 512
  n_pi_samples: 51
  uncertainty_regularizer_coeff: 1.0
  elite_weighting_temperature: 0.5
  gaussian_mean_momentum: 0.1
  q_ensemble_size: 5

  # Input / output structure
  n_obs_steps: 5
  n_action_pred_token: 3
  action_chunk_size: 2

  input_shapes:
    observation.images.bp_cam: [3, 96, 96]
    observation.images.inhand_cam: [3, 96, 96]
    observation.state: ["${env.state_dim}"]
  output_shapes:
    action: ["${env.action_dim}"]

  # Normalization modes
  input_normalization_modes:
    observation.images.bp_cam: mean_std
    observation.images.inhand_cam: mean_std 